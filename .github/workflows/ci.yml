name: CI

# Fast tier runs on every PR and is required to merge. The slow tier (macOS tests,
# real engines, release size) needs the `ci:full` label. Nothing runs on a push to main:
# main only ever gets code a PR already tested.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p dman --no-default-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --workspace
      - run: cargo test -p dman --no-default-features

  # macOS minutes bill at 10x.
  test-macos:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --workspace
      - run: cargo test -p dman --no-default-features

  # Engine tests are #[ignore]d, so --ignored is what runs them.
  engines:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install aria2 and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 ffmpeg
      - name: Install yt-dlp
        run: |
          sudo curl -fsSL -o /usr/local/bin/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          sudo chmod 0755 /usr/local/bin/yt-dlp
          aria2c --version | head -1
          yt-dlp --version
          ffmpeg -version | head -1
      - name: Gated engine tests
        env:
          DMAN_TEST_ARIA2: "1"
          DMAN_TEST_YTDLP: "1"
        run: cargo test -p dman-aria2 -p dman-daemon -p dman-ytdlp -- --ignored --test-threads=1

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # deny.toml targets this release; the one cargo-deny-action bundles rejects its schema.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --all-features check

  # Release size, musl and stripped as shipped.
  size:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release (musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl -p dman
      - name: Report size
        run: |
          bin=target/x86_64-unknown-linux-musl/release/dman
          bytes=$(stat -c %s "$bin")
          mib=$(echo "scale=2; $bytes / 1048576" | bc)
          echo "dman release (x86_64 musl, stripped): $bytes bytes ($mib MiB)"
          {
            echo "### Binary size"
            echo
            echo "x86_64-unknown-linux-musl, stripped, all features: **$mib MiB** ($bytes bytes)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and report the slim build (no optional features)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p dman --no-default-features
          bytes=$(stat -c %s target/x86_64-unknown-linux-musl/release/dman)
          mib=$(echo "scale=2; $bytes / 1048576" | bc)
          echo "dman release, --no-default-features: $bytes bytes ($mib MiB)"
          echo "x86_64-unknown-linux-musl, stripped, \`--no-default-features\`: **$mib MiB** ($bytes bytes)" >> "$GITHUB_STEP_SUMMARY"
