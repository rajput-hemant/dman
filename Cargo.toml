[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
# internal
dman-proto = { path = "crates/dman-proto" }
dman-config = { path = "crates/dman-config" }
dman-aria2 = { path = "crates/dman-aria2" }
dman-daemon = { path = "crates/dman-daemon" }
dman-client = { path = "crates/dman-client" }
dman-tui = { path = "crates/dman-tui" }
dman-store = { path = "crates/dman-store" }

# runtime and data
tokio = { version = "1.54", default-features = false }
tokio-util = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2", default-features = false, features = ["parse", "display", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
secrecy = { version = "0.10", features = ["serde"] }
etcetera = "0.11"
bytesize = "2.7"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.dev]
debug = "line-tables-only"
