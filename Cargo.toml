[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rajput-hemant/dman"
readme = "README.md"
publish = true

[workspace.dependencies]
# internal (the version is required for crates.io; keep it equal to workspace.package.version)
dman-proto = { version = "0.1.0", path = "crates/dman-proto" }
dman-config = { version = "0.1.0", path = "crates/dman-config" }
dman-aria2 = { version = "0.1.0", path = "crates/dman-aria2" }
dman-daemon = { version = "0.1.0", path = "crates/dman-daemon", default-features = false }
dman-client = { version = "0.1.0", path = "crates/dman-client" }
dman-tui = { version = "0.1.0", path = "crates/dman-tui", default-features = false }
dman-store = { version = "0.1.0", path = "crates/dman-store" }
dman-torrent = { version = "0.1.0", path = "crates/dman-torrent" }
dman-ytdlp = { version = "0.1.0", path = "crates/dman-ytdlp" }
dman-search = { version = "0.1.0", path = "crates/dman-search", default-features = false }
dman-web = { version = "0.1.0", path = "crates/dman-web" }

# runtime and data
tokio = { version = "1.54", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2", default-features = false, features = ["parse", "display", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
secrecy = { version = "0.10", features = ["serde"] }
etcetera = "0.11"
bytesize = "2.7"
url = "2.5"
notify-rust = { version = "4.19", default-features = false, features = ["zbus", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# Size over speed: the transfers are I/O-bound (aria2c/yt-dlp do the heavy work); "s" makes the
# binary about 28 % smaller than 3.
opt-level = "s"

[profile.dev]
debug = "line-tables-only"
# Incremental caches grew past the session disk budget; full rebuilds of
# changed crates are fast enough.
incremental = false

# Used by cargo-dist (see dist-workspace.toml): same as release, separate target dir name.
[profile.dist]
inherits = "release"
