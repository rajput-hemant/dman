[package]
name = "dman-daemon"
description = "The dman daemon: owns engines, queue, state and the API server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dman-proto.workspace = true
dman-config.workspace = true
dman-aria2.workspace = true
dman-store = { path = "../dman-store" }
anyhow.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net"] }
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1"] }
subtle = "2.6"
nix = { version = "0.31", default-features = false, features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
tracing.workspace = true
url.workspace = true
base64 = "0.22"

[dev-dependencies]
dman-client = { path = "../dman-client" }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
