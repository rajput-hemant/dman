[package]
name = "dman-search"
description = "Torrent search providers (declarative definitions), engine, parsers and result aggregation for dman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["dman", "torrent", "search", "torznab"]
categories = ["web-programming", "parser-implementations"]

[features]
default = ["engine"]
# The HTTP client, the Torznab/RSS/HTML parsers and the search engine. Without it only
# the data model (provider definitions, results, tracker-list parsing) is built.
engine = ["dep:futures-util", "dep:quick-xml", "dep:reqwest", "dep:rustls", "dep:scraper", "dep:secrecy", "dep:tokio", "dep:tracing"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
quick-xml = { version = "0.42", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "socks"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
scraper = { version = "0.29", default-features = false, optional = true }
secrecy = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"], optional = true }
toml.workspace = true
tracing = { workspace = true, optional = true }
url.workspace = true

[[test]]
name = "doh"
required-features = ["engine"]

[[test]]
name = "engine"
required-features = ["engine"]

[[test]]
name = "live"
required-features = ["engine"]

[[test]]
name = "mirrors"
required-features = ["engine"]

[[test]]
name = "parsers"
required-features = ["engine"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
