[package]
name = "dman-search"
description = "Torrent search providers (declarative definitions), engine, parsers and result aggregation for dman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "gzip", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = { version = "0.29", default-features = false }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }
toml.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
