# Verified live 2026-11-10 against www.torlock.com/rss.xml.
[[provider]]
name = "Torlock"
kind = "feed"
enabled = false
verified = true
order = 80
local_filter = true
test_query = ""
description = "Torlock (RSS of the newest 30, filtered by your words)"
url = "https://www.torlock.com/rss.xml"

# ---------------------------------------------------------- LimeTorrents
# HTML. Result rows carry no magnet: each detail page is read for it (first
# `detail_limit` results only). The domain moves often (limetorrents.lol
# redirects to limetorrents.fun).
# UNVERIFIED (checked 2026-11-10): the search page does not answer from the
# test machine (limetorrents.fun times out on /search/), so the selectors come
# from the real "latest 100" page and a real detail page, which share the
# markup.
[[provider]]
name = "LimeTorrents"
kind = "html"
enabled = false
verified = false
order = 90
timeout_secs = 20
rate_limit_per_min = 30
mirrors = ["https://www.limetorrents.lol"]
test_query = "ubuntu"
description = "LimeTorrents (HTML scrape, detail page per result for the magnet)"
search_url = "https://www.limetorrents.fun/search/all/{query}/seeds/1/"
row = "table.table2 tr[bgcolor]"
title = "td.tdleft div.tt-name a:last-of-type"
detail_link = "td.tdleft div.tt-name a:last-of-type @href"
size = "td.tdnormal:nth-of-type(3)"
seeders = "td.tdseed"
leechers = "td.tdleech"
date = "td.tdnormal:nth-of-type(2)"
follow_detail_for_magnet = true
detail_magnet = "a[href^='magnet:'] @href"
detail_limit = 10

# --------------------------------------------------------- SolidTorrents
# JSON API (/api/v1/search): {"success": true, "results": [{title, size,
# infohash, magnet, swarm: {seeders, leechers}, imported, category}]}.
# solidtorrents.to now redirects to bitsearch.to.
# UNVERIFIED (checked 2026-11-10): bitsearch.to answers 500 or times out and
# solidtorrents.to redirects to it, so no real response could be fetched; the
# format is the one documented for the API before the move and the fixture is
# hand-written.
[[provider]]
name = "SolidTorrents"
kind = "json"
enabled = false
verified = false
order = 100
mirrors = ["https://solidtorrents.to", "https://solidtorrents.net"]
description = "SolidTorrents / BitSearch (JSON API)"
url = "https://bitsearch.to/api/v1/search?q={query}&sort=seeders"
items = "/results"
title = "/title"
size = "/size"
seeders = "/swarm/seeders"
leechers = "/swarm/leechers"
date = "/imported"
info_hash = "/infohash"
magnet = "/magnet"
category = "/category"

# ------------------------------------------------------ TorrentDownloads
# HTML. Result rows carry no magnet: each detail page is read for it (first
# `detail_limit` results only). The first rows of a result page are sponsored
# links to other sites, which the `/torrent/` title selector skips.
# Verified live 2026-11-10 against www.torrentdownloads.pro.
[[provider]]
name = "TorrentDownloads"
kind = "html"
enabled = false
verified = true
order = 110
test_query = "ubuntu"
timeout_secs = 20
rate_limit_per_min = 30
description = "TorrentDownloads (HTML scrape, detail page per result for the magnet)"
search_url = "https://www.torrentdownloads.pro/search/?search={query}"
row = "div.grey_bar3"
title = "p a[href^='/torrent/']"
detail_link = "p a[href^='/torrent/'] @href"
size = "span:nth-of-type(4)"
seeders = "span:nth-of-type(3)"
leechers = "span:nth-of-type(2)"
follow_detail_for_magnet = true
detail_magnet = "a[href^='magnet:'] @href"
detail_limit = 10

# ------------------------------------------------------- Internet Archive
# JSON advancedsearch; only items that have a generated torrent
# (format "Archive BitTorrent"). Public-domain and freely licensed material.
# The torrent is https://archive.org/download/<id>/<id>_archive.torrent (the
# swarm is the archive's web seed). No seeder counts or info hash in the
# listing; `downloads` is the lifetime download count, not shown as seeders.
# Verified live 2026-11-10.
[[provider]]
name = "Internet Archive"
kind = "json"
enabled = false
verified = true
order = 120
test_query = "nasa"
description = "Internet Archive (free and public-domain items, .torrent per item)"
url = "https://archive.org/advancedsearch.php?q=%28{query}%29%20AND%20format%3A%22Archive%20BitTorrent%22&fl%5B%5D=identifier&fl%5B%5D=title&fl%5B%5D=item_size&fl%5B%5D=downloads&fl%5B%5D=publicdate&fl%5B%5D=mediatype&rows=50&output=json"
items = "/response/docs"
title = "/title"
size = "/item_size"
date = "/publicdate"
torrent_url = "https://archive.org/download/{/identifier|enc}/{/identifier|enc}_archive.torrent"
detail_url = "https://archive.org/details/{/identifier|enc}"
category = "/mediatype"

