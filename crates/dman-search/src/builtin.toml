# Built-in provider definitions (declarative data, all off by default).
#
# `verified = true` means the definition was checked against the live service
# (date in the provider's comment): a real response is saved as
# tests/fixtures/live_<provider>.* and parsed by tests/live.rs, and the gated
# end-to-end test (DMAN_TEST_LIVE=1 cargo test -p dman-search -- --ignored)
# passed. `verified = false` means written from knowledge of the public format
# only. Use "Test" in settings; sites change markup, domains and APIs, and
# mirrors differ. Fix by editing the definition.
#
# `mirrors` are alternative base URLs tried in order when the main host fails
# (connection error, timeout, HTTP 403/451/5xx, anti-bot challenge page); the
# one that answered last is tried first. `local_filter = true` marks endpoints
# that only list recent items: the results are filtered by the query words
# after download.

# ---------------------------------------------------------------- 1337x
# HTML. Result rows carry no magnet: each detail page is fetched (first
# `detail_limit` results only) to read it. Confidence: medium (markup changes
# often; Cloudflare may block scraping; domain varies: 1337x.to, 1337x.st ...).
# UNVERIFIED (checked 2026-11-10): 1337x.to, .st, 1337xx.to and x1337x.ws all
# answer 403 with a Cloudflare challenge to non-browser clients, so no real
# page could be fetched to check the selectors. Fixtures are hand-written.
# dman does not solve challenges; reach it through Prowlarr/Jackett with
# FlareSolverr and the Torznab provider (docs/search.md).
[[provider]]
name = "1337x"
kind = "html"
enabled = false
verified = false
order = 10
mirrors = ["https://1337x.st", "https://1337xx.to", "https://x1337x.ws"]
timeout_secs = 20
rate_limit_per_min = 30
description = "1337x (HTML scrape, detail page per result for the magnet)"
search_url = "https://1337x.to/sort-search/{query}/seeders/desc/1/"
row = "table.table-list tbody tr"
title = "td.name a:nth-of-type(2)"
detail_link = "td.name a:nth-of-type(2) @href"
size = "td.size"
seeders = "td.seeds"
leechers = "td.leeches"
follow_detail_for_magnet = true
detail_magnet = "a[href^='magnet:'] @href"
detail_limit = 10

# ------------------------------------------------------- The Pirate Bay
# JSON via the apibay.org API used by the site itself (flat array; string-typed
# numbers; upper-case info_hash; all-zero hash = no results; names are
# HTML-escaped, hence the `html` filter). Verified live 2026-11-09.
[[provider]]
name = "The Pirate Bay"
kind = "json"
enabled = false
verified = true
order = 20
description = "The Pirate Bay (apibay.org JSON API)"
url = "https://apibay.org/q.php?q={query}&cat=0"
items = ""
title = "{/name|html}"
size = "/size"
seeders = "/seeders"
leechers = "/leechers"
date = "/added"
info_hash = "/info_hash"
magnet = "magnet:?xt=urn:btih:{/info_hash}&dn={/name|html|enc}&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337%2Fannounce&tr=udp%3A%2F%2Fopen.stealth.si%3A80%2Fannounce&tr=udp%3A%2F%2Ftracker.torrent.eu.org%3A451%2Fannounce"
detail_url = "https://thepiratebay.org/description.php?id={/id}"

# ----------------------------------------------------------------- Nyaa
# RSS with the nyaa: namespace (seeders, leechers, size, infoHash, category).
# Verified live 2026-11-09 (the magnet is built from infoHash + title).
[[provider]]
name = "Nyaa"
kind = "feed"
enabled = false
verified = true
order = 30
mirrors = ["https://nyaa.land"]
description = "Nyaa (RSS feed with nyaa: extension elements)"
url = "https://nyaa.si/?page=rss&q={query}&c=0_0&f=0"

# --------------------------------------------------------------- Knaben
# JSON POST API (https://api.knaben.org/v1). Verified live 2026-11-09: response
# is {"hits":[{title, bytes, seeders, peers, hash, magnetUrl, details, date
# (RFC 3339), category, ...}]}; `peers` is the leecher count.
[[provider]]
name = "Knaben"
kind = "json"
enabled = false
verified = true
order = 40
description = "Knaben meta-search (JSON POST API)"
url = "https://api.knaben.org/v1"
method = "post"
body = '{"search_type":"100%","search_field":"title","query":"{query}","order_by":"seeders","order_direction":"desc","from":0,"size":100,"hide_unsafe":true,"hide_xxx":true}'
items = "/hits"
title = "/title"
size = "/bytes"
seeders = "/seeders"
leechers = "/peers"
date = "/date"
info_hash = "/hash"
magnet = "/magnetUrl"
detail_url = "/details"
category = "/category"

# ------------------------------------------------------------------ YTS
# JSON list_movies API; one result per torrent (quality) of each movie, the
# magnet is built from the hash. The domain moves often: the API now lives at
# movies-api.accel.li (yts.gg, yts.lt and yts.am redirect or mirror it).
# Verified live 2026-11-10 against movies-api.accel.li.
[[provider]]
name = "YTS"
kind = "json"
enabled = false
verified = true
order = 50
mirrors = ["https://yts.gg", "https://yts.lt", "https://yts.am", "https://yts.mx"]
test_query = "night of the living dead"
description = "YTS movies (JSON API, one result per quality)"
url = "https://movies-api.accel.li/api/v2/list_movies.json?query_term={query}&limit=20&sort_by=seeds"
items = "/data/movies"
expand = "/torrents"
title = "{^/title_long} [{/quality} {/type}]"
size = "/size_bytes"
seeders = "/seeds"
leechers = "/peers"
date = "/date_uploaded_unix"
info_hash = "/hash"
magnet = "magnet:?xt=urn:btih:{/hash}&dn={^/title_long|enc}%20[{/quality}]&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337%2Fannounce&tr=udp%3A%2F%2Fopen.demonii.com%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.torrent.eu.org%3A451%2Fannounce"
torrent_url = "/url"
detail_url = "{^/url}"
category = "movies"

# ----------------------------------------------------------------- EZTV
# JSON API (/api/get-torrents). It has no text search (only imdb_id, limit,
# page), so this lists the 100 newest TV torrents and keeps those matching the
# query. The HTML search is behind a Cloudflare challenge.
# Verified live 2026-11-10 against eztvx.to: `peers` is the leecher count.
[[provider]]
name = "EZTV"
kind = "json"
enabled = false
verified = true
order = 70
local_filter = true
test_query = ""
mirrors = ["https://eztv.re", "https://eztv.wf", "https://eztv.tf"]
description = "EZTV TV releases (JSON API; newest 100 only, filtered by your words)"
url = "https://eztvx.to/api/get-torrents?limit=100&page=1"
items = "/torrents"
title = "/title"
size = "/size_bytes"
seeders = "/seeds"
leechers = "/peers"
date = "/date_released_unix"
info_hash = "/hash"
magnet = "/magnet_url"
category = "tv"

# --------------------------------------------------------------- Torlock
# RSS of the 30 newest torrents (seeds, leechers and size are in the item
# description, the .torrent is the enclosure); filtered by your words. The
