verified = true
order = 130
local_filter = true
test_query = ""
description = "Academic Torrents (RSS of the newest 30, filtered by your words)"
url = "https://academictorrents.com/rss.xml"

# ----------------------------------------------------------- LinuxTracker
# HTML. The info hash is in the link of each row; the magnet is built from it.
# Seeders and leechers count the tracker's own peers (the `+N ext` figures
# from other trackers are not included). Linux distributions and tools.
# Verified live 2026-11-10 against linuxtracker.org.
[[provider]]
name = "LinuxTracker"
kind = "html"
enabled = false
verified = true
order = 140
test_query = "ubuntu"
description = "LinuxTracker (HTML scrape, Linux distributions)"
search_url = "https://linuxtracker.org/torrents/?q={query}"
row = "table.torrent-table tbody tr"
title = "a.torrent-name"
detail_link = "a.torrent-name @href"
info_hash = "a.torrent-name @href"
size = "td.numeric.muted-cell"
seeders = "td.seeds strong"
leechers = "td.leeches strong"
date = "td.muted-cell:not(.numeric)"
date_format = "%b %d, %Y"

# -------------------------------------------------- Torznab (template)
# Prowlarr / Jackett. Fill in the endpoint and store the API key as the secret
# named by `api_key_ref`. Prowlarr: <host>:9696/api/v2.0/indexers/all/results/torznab/api
# Jackett: <host>:9117/api/v2.0/indexers/all/results/torznab/
[[provider]]
name = "Torznab"
kind = "torznab"
enabled = false
verified = false
order = 60
description = "Torznab indexer (Prowlarr, Jackett): edit URL, set API key secret"
url = "http://localhost:9696/api/v2.0/indexers/all/results/torznab/api"
api_key_ref = "torznab"
