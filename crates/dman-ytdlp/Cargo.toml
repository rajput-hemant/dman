[package]
name = "dman-ytdlp"
description = "yt-dlp video engine adapter for dman"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "io-util"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "process", "macros", "time", "io-util", "sync", "fs"] }
tempfile = "3"

[lints]
workspace = true
