[package]
name = "dman"
description = "dman: terminal download manager (CLI, TUI and daemon launcher)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository = "https://github.com/rajput-hemant/dman"
homepage = "https://github.com/rajput-hemant/dman"
keywords = ["download-manager", "aria2", "yt-dlp", "tui", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "dman"
path = "src/main.rs"

[dependencies]
dman-proto.workspace = true
dman-client.workspace = true
dman-config.workspace = true
dman-daemon.workspace = true
dman-tui.workspace = true
dman-ytdlp.workspace = true
clap = { version = "4.6", default-features = false, features = ["std", "derive", "env", "help", "usage", "color", "suggestions", "error-context"] }
# Dynamic completion engine is still behind `unstable-dynamic` in clap_complete 4.6; pinned so an update cannot break it.
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "process", "io-std", "io-util"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
url.workspace = true
bytesize.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64 = "0.22"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.11"
semver = "1"
tempfile = "3"
nix = { version = "0.31", default-features = false, features = ["process"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3"
wiremock = "0.6"

[package.metadata.dist]
dist = true

[lints]
workspace = true
