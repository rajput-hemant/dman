# cargo-dist configuration (https://axodotdev.github.io/cargo-dist/).
# Release flow: bump the version, tag `vX.Y.Z`, push the tag; .github/workflows/release.yml
# builds the four archives, the shell installer and the Homebrew formula and
# publishes a GitHub release.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
# macOS builds are per-architecture (no universal binary): the self-updater
# and Homebrew pick the archive that matches the machine.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
installers = ["shell", "homebrew"]
tap = "rajput-hemant/homebrew-tap"
# Needs the HOMEBREW_TAP_TOKEN repository secret (a PAT with write access to the tap).
publish-jobs = ["homebrew"]
# `dman update` expects `dman-<target>.tar.gz` plus `dman-<target>.tar.gz.sha256`.
unix-archive = ".tar.gz"
checksum = "sha256"
# The shell installer writes ~/.config/dman/dman-receipt.json, which `dman update`
# reads to recognise installer installs (it never uses axoupdater itself).
install-updater = true
install-path = "~/.local/bin"
install-success-msg = "dman installed. Run `dman` to start; `dman update --check` to look for updates."
# Musl needs a C toolchain for ring: see .github/build-setup.yml.
github-build-setup = "build-setup.yml"
pr-run-mode = "plan"
# release.yml is maintained by hand (compact version of the generated one).
allow-dirty = ["ci"]

[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04"
# Native arm64 runner: no cross toolchain needed.
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
x86_64-apple-darwin = "macos-13"
aarch64-apple-darwin = "macos-14"
